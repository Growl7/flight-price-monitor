<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杭州直飞河内机票价格监控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .chart-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        .chart-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        
        .chart-wrapper {
            position: relative;
            height: 400px;
        }
        
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .summary-card h3 {
            font-size: 1.2em;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        
        .summary-card .value {
            font-size: 2em;
            font-weight: bold;
        }
        
        .summary-card .label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-top: 5px;
        }
        
        .detailed-section {
            margin-top: 30px;
        }
        
        .section-title {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #4facfe;
        }
        
        .date-card {
            background: white;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        
        .date-header {
            background: #4facfe;
            color: white;
            padding: 15px 20px;
            font-size: 1.2em;
            font-weight: bold;
        }
        
        .date-content {
            padding: 20px;
        }
        
        .flight-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        .flight-table th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
        }
        
        .flight-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        
        .flight-table tr:hover {
            background: #f8f9fa;
        }
        
        .price-highlight {
            color: #e74c3c;
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .min-price-badge {
            background: #e74c3c;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-left: 5px;
        }
        
        .footer {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
            margin-top: 30px;
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.2em;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .chart-wrapper {
                height: 300px;
            }
            
            .summary-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>杭州直飞河内机票价格监控</h1>
            <p>杭州 → 河内 | 监控日期范围: 2026-10-30 至 2026-11-27</p>
        </div>
        
        <div class="content">
            <!-- 价格趋势图 -->
            <div class="chart-container">
                <h2 class="chart-title">每日最低价格趋势</h2>
                <div class="chart-wrapper">
                    <canvas id="priceChart"></canvas>
                </div>
            </div>
            
            <!-- 时间段分析 -->
            
            
            <!-- 摘要卡片 -->
            <div class="summary-cards">
                <div class="summary-card">
                    <h3>监控天数</h3>
                    <div class="value">0</div>
                    <div class="label">天</div>
                </div>
                <div class="summary-card">
                    <h3>最低价格</h3>
                    <div class="value">¥</div>
                    <div class="label">出现日期: N/A</div>
                </div>
                <div class="summary-card">
                    <h3>平均价格</h3>
                    <div class="value">¥0</div>
                    <div class="label">所有日期平均</div>
                </div>
                <div class="summary-card">
                    <h3>最高价格</h3>
                    <div class="value">¥</div>
                    <div class="label">出现日期: N/A</div>
                </div>
            </div>
            
            <!-- 详细数据 -->
            <div class="detailed-section">
                <h2 class="section-title">详细航班数据</h2>
                
                
                <div class="date-card">
                    <div class="date-header">
                        2026-10-30
                        
                    </div>
                    <div class="date-content">
                        
                        <div class="no-data">暂无航班数据</div>
                        
                    </div>
                </div>
                
                <div class="date-card">
                    <div class="date-header">
                        2026-11-06
                        
                    </div>
                    <div class="date-content">
                        
                        <div class="no-data">暂无航班数据</div>
                        
                    </div>
                </div>
                
                <div class="date-card">
                    <div class="date-header">
                        2026-11-13
                        
                    </div>
                    <div class="date-content">
                        
                        <div class="no-data">暂无航班数据</div>
                        
                    </div>
                </div>
                
                <div class="date-card">
                    <div class="date-header">
                        2026-11-20
                        
                    </div>
                    <div class="date-content">
                        
                        <div class="no-data">暂无航班数据</div>
                        
                    </div>
                </div>
                
                <div class="date-card">
                    <div class="date-header">
                        2026-11-27
                        
                    </div>
                    <div class="date-content">
                        
                        <div class="no-data">暂无航班数据</div>
                        
                    </div>
                </div>
                
            </div>
        </div>
        
        <div class="footer">
            <p>数据更新时间: 2026-08-06 09:23:07</p>
            <p>杭州直飞河内机票价格监控系统</p>
        </div>
    </div>
    
    <script>
        // 价格趋势图
        const ctx = document.getElementById('priceChart').getContext('2d');
        const chartData = {
            labels: [],
            datasets: [{
                label: '每日最低价格 (¥)',
                data: [],
                borderColor: 'rgb(75, 192, 192)',
                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                borderWidth: 3,
                fill: true,
                tension: 0.4,
                pointRadius: 6,
                pointHoverRadius: 8
            }]
        };
        
        new Chart(ctx, {
            type: 'line',
            data: chartData,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            font: {
                                size: 14
                            }
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const index = context.dataIndex;
                                const price = context.parsed.y;
                                const time = chartData.min_price_times[index];
                                let label = `价格: ¥${price}`;
                                if (time) {
                                    label += ` (出现时间: ${time})`;
                                }
                                return label;
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        title: {
                            display: true,
                            text: '价格 (¥)',
                            font: {
                                size: 14
                            }
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: '日期',
                            font: {
                                size: 14
                            }
                        }
                    }
                }
            }
        });
        
        // 小时价格趋势图
        
    </script>
</body>
</html>
