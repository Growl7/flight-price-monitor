name: 机票价格监控

on:
  schedule:
    # 每小时运行一次
    - cron: '0 * * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install undetected-chromedriver
      
      - name: 安装Chrome浏览器
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      
      - name: 运行抓取脚本
        env:
          # GitHub Secrets中的配置（在GitHub仓库设置中添加）
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: |
          python scraper_github.py
      
      - name: 上传网页文件
        uses: actions/upload-artifact@v4
        with:
          name: flight-report-${{ github.run_number }}
          path: |
            output/flight_prices.html
            output/flight_data.json
      
      - name: 提交网页更新到GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "更新价格数据 ${{ github.run_number }}"
          git push