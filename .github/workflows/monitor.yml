name: 机票价格监控

on:
  schedule:
    # 每天运行4次（每6小时一次）
    - cron: '0 */6 * * *'  # 北京时间 0:00, 6:00, 12:00, 18:00
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 安装依赖
        run: pip requests
      
      - name: 运行抓取脚本
        env:
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python scraper_aviationstack.py
      
      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: flight-report-${{ github.run_number }}
          path: output/
