name: 机票价格监控

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 安装依赖
        run: pip install requests jinja2
      
      - name: 运行Trip.com价格监控
        run: python scraper_trip_github.py
      
      - name: 发送邮件报告
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python send_email_report.py
      
      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: flight-report-${{ github.run_number }}
          path: output/
